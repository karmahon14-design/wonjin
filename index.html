<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>바코드 재고관리</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f4f6f8; color: #222; padding: 16px; padding-bottom: 40px; }
    header { background: #1a73e8; color: #fff; padding: 14px; text-align: center; font-size: 1.1rem; font-weight: bold; border-radius: 8px; margin-bottom: 16px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    h2 { font-size: 1rem; margin-bottom: 12px; color: #333; }
    button { border: none; border-radius: 8px; padding: 12px; font-size: 1rem; font-weight: bold; cursor: pointer; width: 100%; transition: 0.2s; }
    .btn-primary { background: #1a73e8; color: #fff; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-secondary { background: #e8f0fe; color: #1a73e8; width: auto; padding: 6px 12px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 10px; font-size: 1rem; }
    
    /* 비디오 화면 스타일 */
    #videoContainer { display: none; margin-bottom: 12px; background: #000; border-radius: 8px; overflow: hidden; position: relative; }
    video { width: 100%; height: auto; display: block; }
    #logBox { font-size: 0.8rem; color: #d93025; background: #fff0f0; padding: 8px; border-radius: 6px; margin-top: 8px; display: none; word-break: break-all; }
    .aim-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70%; height: 120px; border: 2px dashed #00ff00; border-radius: 8px; pointer-events: none; }
  </style>
</head>
<body>

<header>📦 제품 바코드 재고관리</header>

<!-- 스캐너 영역 -->
<div class="card">
  <h2>카메라 스캔</h2>
  <div id="videoContainer">
    <video id="cameraVideo" playsinline autoplay muted></video>
    <div class="aim-box"></div>
  </div>
  <button id="cameraBtn" class="btn-primary" onclick="handleCameraButton()">카메라 스캐너 켜기</button>
  <div id="logBox"></div>
</div>

<!-- 제품 정보 입력 -->
<div class="card">
  <h2>제품 등록 / 입출고</h2>
  <input type="text" id="barcodeVal" placeholder="바코드 번호">
  <input type="text" id="nameVal" placeholder="제품명">
  <input type="number" id="qtyVal" placeholder="수량" value="1">
  <div style="display: flex; gap: 8px;">
    <button class="btn-primary" style="flex: 1;" onclick="processItem(1)">입고 (+)</button>
    <button class="btn-secondary" style="flex: 1; background: #eee; color: #333;" onclick="processItem(-1)">출고 (-)</button>
  </div>
</div>

<script>
  let currentStream = null;
  let isScanning = false;

  function printLog(msg) {
    const logBox = document.getElementById('logBox');
    logBox.style.display = 'block';
    logBox.innerText = msg;
  }

  async function handleCameraButton() {
    const btn = document.getElementById('cameraBtn');
    const container = document.getElementById('videoContainer');
    const video = document.getElementById('cameraVideo');

    if (!isScanning) {
      btn.innerText = '카메라 연결 중...';
      printLog('카메라 장치를 탐색하고 있습니다...');

      // 브라우저 지원 여부 확인
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        printLog('오류: 이 브라우저는 카메라 제어(getUserMedia)를 지원하지 않거나 보안 연결(HTTPS) 상태가 아닙니다.');
        btn.innerText = '카메라 스캐너 켜기';
        return;
      }

      try {
        // 스마트폰 후면 카메라 강제 지정
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;
        await video.play();

        container.style.display = 'block';
        btn.innerText = '카메라 끄기';
        btn.className = 'btn-danger';
        isScanning = true;
        printLog('카메라가 연결되었습니다.');

        // 브라우저 자체 바코드 인식 API (Android Chrome 등 지원 기종 자동 바코드 감지)
        if ('BarcodeDetector' in window) {
          scanBarcodeNative(video);
        } else {
          printLog('카메라 정상 작동 중 (바코드 자동 추출은 브라우저 환경에 따라 수동 입력을 병행해 주세요)');
        }

      } catch (err) {
        printLog('카메라 접속 실패: ' + err.name + ' - ' + err.message);
        btn.innerText = '카메라 스캐너 켜기';
        btn.className = 'btn-primary';
        isScanning = false;
      }

    } else {
      // 카메라 중지
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }
      video.srcObject = null;
      container.style.display = 'none';
      btn.innerText = '카메라 스캐너 켜기';
      btn.className = 'btn-primary';
      isScanning = false;
      document.getElementById('logBox').style.display = 'none';
    }
  }

  // 최신 모바일 브라우저 내장 하드웨어 가속 바코드 디텍터
  async function scanBarcodeNative(videoElem) {
    try {
      const barcodeDetector = new BarcodeDetector();
      const interval = setInterval(async () => {
        if (!isScanning) {
          clearInterval(interval);
          return;
        }
        try {
          const barcodes = await barcodeDetector.detect(videoElem);
          if (barcodes.length > 0) {
            document.getElementById('barcodeVal').value = barcodes[0].rawValue;
            handleCameraButton(); // 스캔 완료 시 카메라 끄기
            clearInterval(interval);
          }
        } catch (e) {}
      }, 500);
    } catch (
